[package]
name = "vivido-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Stdio MCP server that lets any MCP client see and drive Vivido terminals"
readme = "README.md"
repository = "https://github.com/johnproblems/vivido-mcp"
# Demo footage stays on GitHub; the crate only needs code and docs.
exclude = ["assets/"]

[[bin]]
name = "vivido-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
interprocess = "2"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[profile.release]
strip = true
